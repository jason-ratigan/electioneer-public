services:
  db:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_DB: signal
      POSTGRES_USER: signal
      POSTGRES_PASSWORD: signal
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - signal-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U signal -d signal"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  signal-postgres-data:
